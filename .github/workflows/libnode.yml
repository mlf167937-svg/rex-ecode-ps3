name: Build Libnode Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build libnode.so (${{ matrix.abi }})
    # Pin the runner image so ubuntu-latest migrations do not change the build environment.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
            target_host: aarch64-linux-android
          - arch: arm
            abi: armeabi-v7a
            target_host: armv7a-linux-androideabi

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Download & Extract Node.js Source
        run: |
          set -euo pipefail
          curl -fsSLO https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz
          tar -xzf node-v26.13.0.tar.gz

      - name: Patch zlib (android_getCpuFeatures)
        run: |
          set -euo pipefail
          cat >> node-v26.13.0/deps/zlib/cpu_features.c <<'EOF'

          #if defined(__ANDROID__) && (defined(__aarch64__) || defined(__arm__))
          #include <sys/auxv.h>
          #include <asm/hwcap.h>
          uint64_t android_getCpuFeatures(void) {
            uint64_t f = 0;
          #if defined(__aarch64__)
            unsigned long h = getauxval(AT_HWCAP);
            if (h & HWCAP_CRC32) f |= ANDROID_CPU_ARM64_FEATURE_CRC32;
            if (h & HWCAP_PMULL) f |= ANDROID_CPU_ARM64_FEATURE_PMULL;
          #else
            unsigned long h = getauxval(AT_HWCAP2);
            if (h & HWCAP2_CRC32) f |= ANDROID_CPU_ARM_FEATURE_CRC32;
            if (h & HWCAP2_PMULL) f |= ANDROID_CPU_ARM_FEATURE_PMULL;
          #endif
            return f;
          }
          #endif
          EOF

      - name: Build libnode.so for ${{ matrix.abi }}
        shell: bash
        run: |
          set -euo pipefail
          cd node-v26.13.0

          export NDK="${ANDROID_NDK_LATEST_HOME:?Android NDK was not found on this runner}"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export API=24

          # Compiler untuk host tools tetap native x86_64.
          export GYP_DEFINES="OS=android host_os=linux android_ndk_path=$NDK"
          export CC_host=gcc
          export CXX_host=g++
          export LINK_host=g++
          export AR_host=ar

          # Compiler untuk target Android berasal dari Android NDK.
          export CC_target="$TOOLCHAIN/bin/${{ matrix.target_host }}${API}-clang"
          export CXX_target="$TOOLCHAIN/bin/${{ matrix.target_host }}${API}-clang++"
          export AR_target="$TOOLCHAIN/bin/llvm-ar"
          export LINK_target="$CXX_target"
          export CC="$CC_target"
          export CXX="$CXX_target"
          export AR="$AR_target"
          export LINK="$LINK_target"

          ./configure \
            --dest-cpu=${{ matrix.arch }} \
            --dest-os=android \
            --shared \
            --without-intl \
            --without-node-snapshot \
            --without-node-code-cache \
            --openssl-no-asm \
            --cross-compiling

          # pipefail is important: without it, tee can hide a failed make command.
          make -j"$(nproc)" 2>&1 | tee "../build-${{ matrix.abi }}.log"

          OUT_DIR="../output/${{ matrix.abi }}"
          mkdir -p "$OUT_DIR"

          # Node may suffix libnode with its module ABI version. Find either form,
          # then publish a stable filename for Android packaging.
          LIBNODE="$(find out/Release -type f \( -name 'libnode.so' -o -name 'libnode.so.*' \) -print -quit)"
          if [[ -z "$LIBNODE" ]]; then
            echo "ERROR: libnode shared library was not generated for ${{ matrix.abi }}."
            echo "Build output files (last 100):"
            find out/Release -maxdepth 5 -type f -print 2>/dev/null | sort | tail -n 100 || true
            exit 1
          fi

          cp -v "$LIBNODE" "$OUT_DIR/libnode.so"
          file "$OUT_DIR/libnode.so"
          test -s "$OUT_DIR/libnode.so"

      - name: Show build errors on failure
        if: failure()
        shell: bash
        run: |
          LOG="build-${{ matrix.abi }}.log"
          if [[ -f "$LOG" ]]; then
            grep -n -m 40 -E 'error:|Error [0-9]|FAILED:' "$LOG" || true
            echo "--- Last 80 log lines ---"
            tail -n 80 "$LOG"
          else
            echo "Build log not found: $LOG"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: libnode-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/libnode.so
          if-no-files-found: error
          retention-days: 7
