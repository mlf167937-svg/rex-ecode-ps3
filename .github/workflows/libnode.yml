name: Build Libnode Android (Sequential)

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/libnode.yml"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libnode-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"
  ANDROID_API: "24"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: "5G"
  CCACHE_COMPILERCHECK: content

jobs:
  build-android:
    name: Build ARM64 then ARM32
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
          echo "=== Runner CPU ==="
          nproc
          echo "=== Runner memory ==="
          free -h
          grep MemTotal /proc/meminfo

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-android-node-${{ env.NODE_VERSION }}-${{ hashFiles('.github/workflows/libnode.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-android-node-${{ env.NODE_VERSION }}-

      - name: Prepare compiler cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      - name: Download Node.js source once
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "node-v${NODE_VERSION}.tar.gz" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.gz"

      - name: Build ARM64 first, then ARM32
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_LATEST_HOME:?Android NDK not found on runner}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          JOBS="$(nproc)"
          # Avoid overcommitting memory on hosted runners. This reports the
          # available RAM and uses at most the runner's advertised CPU count.
          MEM_KB="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          MEM_JOBS="$(( MEM_KB / 3500000 ))"
          if (( MEM_JOBS < 1 )); then MEM_JOBS=1; fi
          if (( JOBS > MEM_JOBS )); then JOBS="$MEM_JOBS"; fi

          echo "Runner CPUs: $(nproc)"
          echo "Available memory at start: $((MEM_KB / 1024)) MiB"
          echo "Build parallelism: -j${JOBS}"
          echo "NDK: $NDK"
          echo "Compiler cache before build:"
          ccache -s

          mkdir -p output

          build_abi() {
            local ARCH="$1"
            local ABI="$2"
            local TARGET_HOST="$3"
            local SOURCE_DIR="node-v${NODE_VERSION}-${ABI}"
            local API="$ANDROID_API"

            echo
            echo "=================================================="
            echo "Starting ${ABI} (${ARCH})"
            echo "=================================================="

            mkdir -p "$SOURCE_DIR"
            tar -xzf "node-v${NODE_VERSION}.tar.gz" \
              --strip-components=1 -C "$SOURCE_DIR"

            # Apply the repository's Android zlib CPU feature workaround.
            cat >> "$SOURCE_DIR/deps/zlib/cpu_features.c" <<'EOF'

          #if defined(__ANDROID__) && (defined(__aarch64__) || defined(__arm__))
          #include <sys/auxv.h>
          #include <asm/hwcap.h>
          uint64_t android_getCpuFeatures(void) {
            uint64_t f = 0;
          #if defined(__aarch64__)
            unsigned long h = getauxval(AT_HWCAP);
            if (h & HWCAP_CRC32) f |= ANDROID_CPU_ARM64_FEATURE_CRC32;
            if (h & HWCAP_PMULL) f |= ANDROID_CPU_ARM64_FEATURE_PMULL;
          #else
            unsigned long h = getauxval(AT_HWCAP2);
            if (h & HWCAP2_CRC32) f |= ANDROID_CPU_ARM_FEATURE_CRC32;
            if (h & HWCAP2_PMULL) f |= ANDROID_CPU_ARM_FEATURE_PMULL;
          #endif
            return f;
          }
          #endif
          EOF

            (
              cd "$SOURCE_DIR"

              export GYP_DEFINES="target_arch=${ARCH} v8_target_arch=${ARCH} android_target_arch=${ARCH} host_os=linux OS=android android_ndk_path=${NDK}"

              # Host build tools remain native x86_64 for BOTH Android targets.
              export CC_host="$(command -v gcc)"
              export CXX_host="$(command -v g++)"
              export LINK_host="$(command -v g++)"
              export AR_host="$(command -v ar)"

              # Only target binaries use Android NDK cross-compilers.
              export CC_target="ccache ${TOOLCHAIN}/bin/${TARGET_HOST}${API}-clang"
              export CXX_target="ccache ${TOOLCHAIN}/bin/${TARGET_HOST}${API}-clang++"
              export AR_target="${TOOLCHAIN}/bin/llvm-ar"
              export LINK_target="$CXX_target"
              export CC="$CC_target"
              export CXX="$CXX_target"
              export AR="$AR_target"
              export LINK="$LINK_target"

              ./configure \
                --dest-cpu="${ARCH}" \
                --dest-os=android \
                --shared \
                --without-intl \
                --without-node-snapshot \
                --without-node-code-cache \
                --openssl-no-asm \
                --cross-compiling \
                --v8-disable-temporal-support

              make -j"${JOBS}" 2>&1 | tee "../build-${ABI}.log"

              local LIBNODE
              LIBNODE="$(find out/Release -type f \( -name 'libnode.so' -o -name 'libnode.so.*' \) -print -quit)"
              if [[ -z "$LIBNODE" ]]; then
                echo "ERROR: libnode shared library missing for ${ABI}"
                find out/Release -maxdepth 5 -type f -print 2>/dev/null | sort | tail -n 100 || true
                exit 1
              fi

              mkdir -p "../output/${ABI}"
              cp -v "$LIBNODE" "../output/${ABI}/libnode.so"
              test -s "../output/${ABI}/libnode.so"
              file "../output/${ABI}/libnode.so"
              "${TOOLCHAIN}/bin/llvm-readelf" -h "../output/${ABI}/libnode.so" | grep -E 'Class:|Machine:'
            )

            echo "Finished ${ABI}"
            rm -rf "$SOURCE_DIR"
            echo "Compiler cache after ${ABI}:"
            ccache -s
          }

          # Deliberately sequential: ARM32 will not start until ARM64 succeeds.
          build_abi "arm64" "arm64-v8a" "aarch64-linux-android"
          build_abi "arm" "armeabi-v7a" "armv7a-linux-androideabi"

          echo "Both ABI builds completed."
          find output -type f -maxdepth 3 -print -exec ls -lh {} \;

      - name: Show build diagnostics
        if: failure()
        shell: bash
        run: |
          for LOG in build-arm64-v8a.log build-armeabi-v7a.log; do
            if [[ -f "$LOG" ]]; then
              echo "===== $LOG: errors ====="
              grep -n -m 40 -E 'error:|Error [0-9]|FAILED:' "$LOG" || true
              echo "===== $LOG: last 80 lines ====="
              tail -n 80 "$LOG"
            fi
          done
          echo "=== Runner memory snapshot ==="
          free -h || true

      - name: Show compiler cache statistics
        if: always()
        run: ccache -s || true

      - name: Upload both Android libraries
        uses: actions/upload-artifact@v6
        with:
          name: libnode-android-both
          path: |
            output/arm64-v8a/libnode.so
            output/armeabi-v7a/libnode.so
          if-no-files-found: error
          retention-days: 7
