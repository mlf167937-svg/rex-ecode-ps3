name: Download MediaFire PKG, Split 4 Rata, Upload

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  MEDIAFIRE_URL: 'https://www.mediafire.com/file_premium/3nr4ucevosspsgn/NARUTO_PS3_MODPACK_PART_3.pkg'
  BASE_NAME: 'NARUTO_PS3_MODPACK_PART_3'
  NUM_PARTS: 4

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start FlareSolverr
        run: |
          docker run -d --name flaresolverr -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 30); do
            if curl -s http://localhost:8191/v1 > /dev/null 2>&1; then
              echo "FlareSolverr ready"
              break
            fi
            echo "Waiting for FlareSolverr... ($i)"
            sleep 2
          done

      - name: Get direct link via FlareSolverr
        run: |
          cat > solve.js << 'EOF'
          const fs = require('fs');

          (async () => {
            const url = process.env.MEDIAFIRE_URL;
            const body = {
              cmd: 'request.get',
              url: url,
              maxTimeout: 120000
            };

            const resp = await fetch('http://localhost:8191/v1', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });

            const data = await resp.json();
            console.log('Status:', data.status);

            if (data.status !== 'ok') {
              throw new Error('FlareSolverr gagal: ' + JSON.stringify(data.message));
            }

            const html = data.solution.response;
            const match = html.match(/id="downloadButton"[^>]*href="([^"]+)"/);
            if (!match) {
              const match2 = html.match(/href="(https:\/\/download[^"]+)"/);
              if (!match2) {
                fs.writeFileSync('debug.html', html);
                throw new Error('Tombol download tidak ditemukan di HTML');
              }
              fs.writeFileSync('direct_link.txt', match2[1]);
              console.log('Direct link:', match2[1]);
              return;
            }

            fs.writeFileSync('direct_link.txt', match[1]);
            console.log('Direct link:', match[1]);
          })().catch(err => {
            console.error('Error:', err.message);
            process.exit(1);
          });
          EOF
          node solve.js

      - name: Download file
        run: |
          DIRECT_LINK=$(cat direct_link.txt)
          echo "Downloading from: $DIRECT_LINK"
          curl -L --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o "full.pkg" \
            "$DIRECT_LINK"
          ls -lh full.pkg
          if file full.pkg | grep -qi "HTML"; then
            echo "File HTML, gagal download"
            exit 1
          fi

      - name: Split into 4 equal parts
        run: |
          SIZE=$(stat -c%s full.pkg)
          PART_SIZE=$(( (SIZE + NUM_PARTS - 1) / NUM_PARTS ))
          # bulatkan ke MB terdekat biar rapi
          PART_SIZE_MB=$(( PART_SIZE / 1024 / 1024 + 1 ))
          echo "Total size: $SIZE bytes"
          echo "Part size: ${PART_SIZE_MB}MB"
          mkdir -p parts
          split -b ${PART_SIZE_MB}M -d -a 1 full.pkg parts/${BASE_NAME}.part
          echo "Hasil split:"
          ls -lh parts/
          echo "Jumlah part: $(ls parts | wc -l)"

      - name: Bundle parts
        run: |
          tar -cf parts.tar -C parts .
          ls -lh parts.tar

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: parts-bundle
          path: parts.tar
          retention-days: 1
          compression-level: 0

  upload-parts:
    needs: download-and-split
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        part: [0,1,2,3]   # split -a 1 → suffix 0..3 (4 part)

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: parts-bundle

      - name: Extract
        run: |
          mkdir -p parts
          tar -xf parts.tar -C parts

      - name: Pick part
        id: pick
        run: |
          FILE="parts/${BASE_NAME}.part${{ matrix.part }}"
          if [ -f "$FILE" ]; then
            echo "file=$FILE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            ls -lh "$FILE"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Part ${{ matrix.part }} tidak ada — cek log split di job pertama"
          fi

      - name: Upload part
        if: steps.pick.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}_part${{ matrix.part }}
          path: ${{ steps.pick.outputs.file }}
          retention-days: 7
          compression-level: 0