name: Build Libnode Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Tetap bisa dijalankan manual jika diperlukan

jobs:
  build-android:
    name: Build libnode.so (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: arm
            abi: armeabi-v7a

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download & Extract Node.js Source
        run: |
          wget https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz
          tar -xzf node-v26.13.0.tar.gz

      - name: Build libnode.so for ${{ matrix.abi }}
        run: |
          cd node-v26.13.0
          
          # Gunakan Android NDK bawaan GitHub Runner
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          
          ./configure \
            --dest-cpu=${{ matrix.arch }} \
            --dest-os=android \
            --shared \
            --openssl-no-asm \
            --cross-compiling
            
          make -j$(nproc)
          
          # Buat folder output
          mkdir -p ../output/${{ matrix.abi }}
          
          # Cari & copy libnode.so
          find out/Release/ -name "libnode.so" -exec cp {} ../output/${{ matrix.abi }}/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/libnode.so
