name: Build Libnode Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build libnode.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
            target_host: aarch64-linux-android
            host_flags: ""
          - arch: arm
            abi: armeabi-v7a
            target_host: armv7a-linux-androideabi
            host_flags: "-m32"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-multilib g++-multilib

      - name: Download & Extract Node.js Source
        run: |
          wget -q https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz
          tar -xzf node-v26.13.0.tar.gz

      - name: Patch zlib (android_getCpuFeatures)
        run: |
          cat >> node-v26.13.0/deps/zlib/cpu_features.c <<'EOF'

          #if defined(__ANDROID__) && (defined(__aarch64__) || defined(__arm__))
          #include <sys/auxv.h>
          #include <asm/hwcap.h>
          uint64_t android_getCpuFeatures(void) {
            uint64_t f = 0;
          #if defined(__aarch64__)
            unsigned long h = getauxval(AT_HWCAP);
            if (h & HWCAP_CRC32) f |= ANDROID_CPU_ARM64_FEATURE_CRC32;
            if (h & HWCAP_PMULL) f |= ANDROID_CPU_ARM64_FEATURE_PMULL;
          #else
            unsigned long h = getauxval(AT_HWCAP2);
            if (h & HWCAP2_CRC32) f |= ANDROID_CPU_ARM_FEATURE_CRC32;
            if (h & HWCAP2_PMULL) f |= ANDROID_CPU_ARM_FEATURE_PMULL;
          #endif
            return f;
          }
          #endif
          EOF

      - name: Build libnode.so for ${{ matrix.abi }}
        run: |
          cd node-v26.13.0

          export NDK=$ANDROID_NDK_LATEST_HOME
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export API=24

          # host_os wajib ada, kalau tidak GYP gagal di v8.gyp
          export GYP_DEFINES="OS=android host_os=linux android_ndk_path=$NDK"

          # Host tools memakai GCC Linux
          export CC_host="gcc ${{ matrix.host_flags }}"
          export CXX_host="g++ ${{ matrix.host_flags }}"
          export LINK_host="g++ ${{ matrix.host_flags }}"
          export AR_host=ar

          # Target memakai Clang NDK
          export CC_target=$TOOLCHAIN/bin/${{ matrix.target_host }}${API}-clang
          export CXX_target=$TOOLCHAIN/bin/${{ matrix.target_host }}${API}-clang++
          export AR_target=$TOOLCHAIN/bin/llvm-ar
          export LINK_target=$CXX_target
          export CC=$CC_target
          export CXX=$CXX_target
          export AR=$AR_target
          export LINK=$LINK_target

          ./configure \
            --dest-cpu=${{ matrix.arch }} \
            --dest-os=android \
            --shared \
            --without-intl \
            --without-node-snapshot \
            --without-node-code-cache \
            --openssl-no-asm \
            --cross-compiling

          make -j4 2>&1 | tee ../build.log

          mkdir -p ../output/${{ matrix.abi }}
          find out/Release -name "libnode*.so*" -exec cp -v {} ../output/${{ matrix.abi }}/ \;
          ls -la ../output/${{ matrix.abi }}

      - name: Show first errors on failure
        if: failure()
        run: grep -n -m20 -E "error:|Error [0-9]" build.log || true

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libnode-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/