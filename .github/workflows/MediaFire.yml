name: MediaFire Download via Puppeteer

on:
  push:
    branches: [main]

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install puppeteer

      - name: Get direct link with Puppeteer
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new' });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
            await page.goto('https://www.mediafire.com/file_premium/3nr4ucevosspsgn/NARUTO_PS3_MODPACK_PART_3.pkg', { waitUntil: 'networkidle2', timeout: 120000 });
            // Tunggu dan ambil link unduhan, selector perlu disesuaikan dengan halaman aktual
            await page.waitForSelector('a#downloadButton', { timeout: 120000 });
            const link = await page.\$eval('a#downloadButton', el => el.href);
            console.log('DIRECT_LINK=' + link);
            await browser.close();
          })();
          " > link.txt

      - name: Extract link and download
        run: |
          DIRECT_LINK=$(grep 'DIRECT_LINK=' link.txt | cut -d'=' -f2-)
          curl -L -o file.pkg "$DIRECT_LINK"

      - name: Zip and upload
        run: |
          sudo apt-get install -y p7zip-full
          7z a -tzip -mx=9 file.zip file.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: mediafire-zip
          path: file.zip