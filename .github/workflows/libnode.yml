name: Build Libnode Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build libnode.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
            target_host: aarch64-linux-android
          - arch: arm
            abi: armeabi-v7a
            target_host: armv7a-linux-androideabi

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download & Extract Node.js Source
        run: |
          wget https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz
          tar -xzf node-v26.13.0.tar.gz

      - name: Build libnode.so for ${{ matrix.abi }}
        run: |
          cd node-v26.13.0
          
          export NDK=$ANDROID_NDK_LATEST_HOME
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export API=24
          
          # PERBAIKAN: Tambahkan host_os=linux dan OS=android
          export ANDROID_NDK_PATH=$NDK
          export android_ndk_path=$NDK
          export GYP_DEFINES="android_ndk_path=$NDK host_os=linux OS=android"
          
          # 1. Gunakan GCC standar Linux untuk host tools (mksnapshot, dll)
          export CC_host=gcc
          export CXX_host=g++
          export LINK_host=g++
          
          # 2. Gunakan Clang NDK untuk target Android
          export CC_target=$TOOLCHAIN/bin/${{ matrix.target_host }}${API}-clang
          export CXX_target=$TOOLCHAIN/bin/${{ matrix.target_host }}${API}-clang++
          export AR_target=$TOOLCHAIN/bin/llvm-ar
          export LINK_target=$TOOLCHAIN/bin/${{ matrix.target_host }}${API}-clang++
          
          export CC=$CC_target
          export CXX=$CXX_target
          export AR=$AR_target
          export LINK=$LINK_target

          # 3. Konfigurasi
          ./configure \
            --dest-cpu=${{ matrix.arch }} \
            --dest-os=android \
            --shared \
            --without-intl \
            --without-node-snapshot \
            --without-node-code-cache \
            --openssl-no-asm \
            --cross-compiling
            
          # 4. Jalankan kompilasi (gunakan -j4)
          make -j4
          
          # 5. Ekspor file output
          mkdir -p ../output/${{ matrix.abi }}
          find out/Release/ -maxdepth 2 -name "libnode.so" -exec cp {} ../output/${{ matrix.abi }}/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/libnode.so
