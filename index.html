<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS3 Web OS v2</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="topbar">PS3 WEB OS v2</div>

<div id="menu">
  <button onclick="openTab('home')">Home</button>
  <button onclick="openTab('editor')">Editor</button>
  <button onclick="openTab('files')">Files</button>
</div>

<!-- HOME -->
<div id="home" class="tab">
  <h2>Dashboard</h2>
  <p>Status: Online</p>
</div>

<!-- EDITOR -->
<div id="editor" class="tab" style="display:none;">
  <h2>Code Editor</h2>

  <textarea id="code"><!DOCTYPE html>
<html>
<body>
<h1>Hello PS3 v2</h1>
</body>
</html>
  </textarea>

  <button onclick="runCode()">RUN</button>
  <button onclick="saveFile()">SAVE</button>

  <iframe id="preview"></iframe>
</div>

<!-- FILES -->
<div id="files" class="tab" style="display:none;">
  <h2>File Manager</h2>

  <button onclick="loadFiles()">Refresh</button>

  <ul id="fileList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
