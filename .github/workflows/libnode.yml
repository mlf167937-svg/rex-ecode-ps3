
name: Build Android libnode

on:
  push:

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0"
  ANDROID_API: "24"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
            elf: AArch64
            ndk_libdir: aarch64-linux-android
          - abi: armeabi-v7a
            arch: arm
            elf: ARM
            ndk_libdir: arm-linux-androideabi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Prepare directories
        run: |
          mkdir -p node-src
          mkdir -p logs/${{ matrix.abi }}
          mkdir -p dist

      - name: Download Node.js source
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"

          grep " node-v${NODE_VERSION}.tar.xz$" SHASUMS256.txt | sha256sum -c -

          tar -xJf "node-v${NODE_VERSION}.tar.xz" \
            --strip-components=1 \
            -C node-src

      - name: Configure Android
        working-directory: node-src
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_API: ${{ env.ANDROID_API }}
          ARCH: ${{ matrix.arch }}
          ABI: ${{ matrix.abi }}
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="$GITHUB_WORKSPACE/logs/$ABI/configure.log"

          exec > >(tee "$LOG") 2>&1

          trap 'status=$?; { echo "## Android configure failed: $ABI"; tail -n 100 "$LOG"; } >> "$GITHUB_STEP_SUMMARY"; exit "$status"' ERR

          test -d "$ANDROID_NDK_HOME"

          echo 'LDFLAGS=-llog' >> "$GITHUB_ENV"
          export LDFLAGS="-llog"

          python3 - <<'PY'
          from pathlib import Path
          import sys

          path = Path("android_configure.py")
          source = path.read_text()

          old = 'os.system("./configure --dest-cpu=" + DEST_CPU + " --dest-os=android --openssl-no-asm --cross-compiling")'

          new = 'if os.system("./configure --dest-cpu=" + DEST_CPU + " --dest-os=android --openssl-no-asm --cross-compiling --shared") != 0:\n    sys.exit(1)'

          if old not in source:
              sys.exit("Could not locate Android configure command")

          path.write_text(source.replace(old, new, 1))
          PY

          ./android-configure patch

          ./android-configure \
            "$ANDROID_NDK_HOME" \
            "$ANDROID_API" \
            "$ARCH"

          test -f out/Makefile
          test -f out/config.gypi

      - name: Compile Node.js
        working-directory: node-src
        env:
          ABI: ${{ matrix.abi }}
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="$GITHUB_WORKSPACE/logs/$ABI/compile.log"

          exec > >(tee "$LOG") 2>&1

          trap 'status=$?; { echo "## Compilation failed: $ABI"; tail -n 100 "$LOG"; } >> "$GITHUB_STEP_SUMMARY"; exit "$status"' ERR

          export LDFLAGS="-llog"

          make -j2

          LIBNODE="$(find out/Release \
            \( -type f -o -type l \) \
            -name 'libnode.so*' \
            -print -quit)"

          if [ -z "$LIBNODE" ]; then
            find out -name 'libnode*' -print
            exit 1
          fi

          mkdir -p "../dist/$ABI"

          cp -L "$LIBNODE" "../dist/$ABI/libnode.so"

          LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$LLVM/llvm-strip" --strip-debug "../dist/$ABI/libnode.so"

          "$LLVM/llvm-readelf" -h "../dist/$ABI/libnode.so"
          "$LLVM/llvm-readelf" -d "../dist/$ABI/libnode.so"

          "$LLVM/llvm-readelf" -h "../dist/$ABI/libnode.so" | grep -q "${{ matrix.elf }}"

          if "$LLVM/llvm-readelf" -d "../dist/$ABI/libnode.so" | grep -q 'libc++_shared.so'; then
            cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.ndk_libdir }}/libc++_shared.so" "../dist/$ABI/"
          fi

      - name: Collect headers
        if: matrix.abi == 'arm64-v8a'
        working-directory: node-src
        run: |
          mkdir -p ../dist/headers/node
          mkdir -p ../dist/headers/v8
          mkdir -p ../dist/headers/uv

          find src -maxdepth 1 -type f -name '*.h' -exec cp {} ../dist/headers/node/ \;

          cp -a deps/v8/include/. ../dist/headers/v8/
          cp -a deps/uv/include/. ../dist/headers/uv/
          cp out/config.gypi ../dist/headers/config.gypi

      - name: Upload library
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libnode-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.abi }}
          path: logs/${{ matrix.abi }}/
          if-no-files-found: warn
          retention-days: 14

  package:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libnode-*
          path: merged
          merge-multiple: true

      - name: Package ZIP
        run: |
          mkdir -p RexChat-libnode
          cp -a merged/. RexChat-libnode/
          zip -qr RexChat-libnode-v${NODE_VERSION}.zip RexChat-libnode

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RexChat-libnode-v${{ env.NODE_VERSION }}
          path: RexChat-libnode-v${{ env.NODE_VERSION }}.zip
          retention-days: 30
