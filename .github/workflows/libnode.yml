
name: Build Android libnode

on:
  push:

permissions:
  contents: read

env:
  NODE_VERSION: v26.13.0
  ANDROID_API: "24"

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
            cpu: arm64
            prefix: aarch64-linux-android
            sysroot: aarch64-linux-android

          - abi: armeabi-v7a
            arch: arm
            cpu: arm
            prefix: armv7a-linux-androideabi
            sysroot: arm-linux-androideabi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare logs
        run: mkdir -p logs/${{ matrix.abi }} dist

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Download Node.js source
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "$NODE_VERSION" https://github.com/nodejs/node.git node-src 2>&1 | tee "logs/${{ matrix.abi }}/download.log"

      - name: Configure Android
        working-directory: node-src
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ARCH: ${{ matrix.arch }}
          ABI: ${{ matrix.abi }}
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee "../logs/${ABI}/configure.log") 2>&1

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "$TOOLCHAIN"
          test -x "$TOOLCHAIN/bin/${{ matrix.prefix }}${ANDROID_API}-clang"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$TOOLCHAIN/bin/${{ matrix.prefix }}${ANDROID_API}-clang"
          export CXX="$TOOLCHAIN/bin/${{ matrix.prefix }}${ANDROID_API}-clang++"

          export GYP_DEFINES="target_arch=${ARCH} v8_target_arch=${ARCH} android_target_arch=${ARCH} host_os=linux OS=android android_ndk_path=${ANDROID_NDK_HOME}"

          "$CC" --version
          "$CXX" --version

          ./android-configure patch

          ./configure \
            --dest-cpu="${{ matrix.cpu }}" \
            --dest-os=android \
            --openssl-no-asm \
            --cross-compiling \
            --shared

          test -f out/Makefile
          test -f out/config.gypi

          grep -n "node_shared" out/config.gypi

      - name: Compile libnode
        working-directory: node-src
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ABI: ${{ matrix.abi }}
          SYSROOT: ${{ matrix.sysroot }}
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee "../logs/${ABI}/compile.log") 2>&1

          make -C out -j2 BUILDTYPE=Release libnode

          LIBNODE="$(find out/Release -type f -name 'libnode.so' -print -quit)"

          if [ -z "$LIBNODE" ]; then
            find out -name 'libnode*' -print
            exit 1
          fi

          mkdir -p "../dist/${ABI}"

          cp "$LIBNODE" "../dist/${ABI}/libnode.so"

          LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if "$LLVM/llvm-readelf" -d "../dist/${ABI}/libnode.so" | grep -q 'libc++_shared.so'; then
            cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${SYSROOT}/libc++_shared.so" "../dist/${ABI}/"
          fi

          "$LLVM/llvm-strip" --strip-debug "../dist/${ABI}/libnode.so"

          "$LLVM/llvm-readelf" -h "../dist/${ABI}/libnode.so"
          "$LLVM/llvm-readelf" -d "../dist/${ABI}/libnode.so"

      - name: Collect headers
        if: matrix.abi == 'arm64-v8a'
        working-directory: node-src
        run: |
          mkdir -p ../dist/headers/node
          mkdir -p ../dist/headers/v8
          mkdir -p ../dist/headers/uv

          find src -maxdepth 1 -type f -name '*.h' -exec cp {} ../dist/headers/node/ \;

          cp -a deps/v8/include/. ../dist/headers/v8/
          cp -a deps/uv/include/. ../dist/headers/uv/
          cp out/config.gypi ../dist/headers/config.gypi

      - name: Upload library
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libnode-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.abi }}
          path: logs/${{ matrix.abi }}/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package RexChat libraries
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libnode-*
          path: merged
          merge-multiple: true

      - name: Create ZIP
        run: |
          mkdir -p RexChat-libnode
          cp -a merged/. RexChat-libnode/
          zip -qr RexChat-libnode-v26.13.0.zip RexChat-libnode

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RexChat-libnode-v26.13.0
          path: RexChat-libnode-v26.13.0.zip
          retention-days: 30
